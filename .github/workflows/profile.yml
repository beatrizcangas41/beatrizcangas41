name: Refresh profile graphics

on:
  schedule:
    - cron: "23 9 * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/profile.yml"

permissions:
  contents: write

concurrency:
  group: profile-graphics
  cancel-in-progress: false

jobs:
  graphics:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Generate public GitHub statistics
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&hide_border=true&bg_color=0D1117&title_color=A78BFA&icon_color=8B5CF6&text_color=C9D1D9&border_radius=12&hide_rank=true
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate public repository language card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=8&hide_border=true&bg_color=0D1117&title_color=A78BFA&text_color=C9D1D9&border_radius=12
          path: profile/top-languages.svg
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            profile/github-snake.svg?palette=github-dark&color_snake=%23A78BFA&color_dots=%23161B22,%23312E81,%234338CA,%236D28D9,%238B5CF6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Save generated graphics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Refresh public profile graphics"
          git push
